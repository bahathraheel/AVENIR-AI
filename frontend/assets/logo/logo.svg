<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" width="300" height="60">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF7900"/>
      <stop offset="100%" style="stop-color:#FF9A32"/>
    </linearGradient>
  </defs>
  <!-- AVENIR text -->
  <text x="10" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="2" fill="#252525">AVENIR</text>
  <!-- AI text -->
  <text x="195" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="2" fill="url(#orangeGrad)">AI</text>
  <!-- AI symbol - neural network nodes -->
  <circle cx="260" cy="18" r="4" fill="#FF7900" opacity="0.8"/>
  <circle cx="278" cy="12" r="3" fill="#FF9A32" opacity="0.6"/>
  <circle cx="272" cy="30" r="3.5" fill="#FF7900" opacity="0.7"/>
  <circle cx="290" cy="22" r="3" fill="#FF9A32" opacity="0.5"/>
  <circle cx="285" cy="38" r="2.5" fill="#FF7900" opacity="0.6"/>
  <!-- Connecting lines -->
  <line x1="260" y1="18" x2="278" y2="12" stroke="#FF7900" stroke-width="1" opacity="0.4"/>
  <line x1="260" y1="18" x2="272" y2="30" stroke="#FF7900" stroke-width="1" opacity="0.4"/>
  <line x1="278" y1="12" x2="290" y2="22" stroke="#FF9A32" stroke-width="1" opacity="0.3"/>
  <line x1="272" y1="30" x2="290" y2="22" stroke="#FF9A32" stroke-width="1" opacity="0.3"/>
  <line x1="272" y1="30" x2="285" y2="38" stroke="#FF7900" stroke-width="1" opacity="0.3"/>
  <!-- Upward arrow suggesting growth -->
  <path d="M 255 48 L 260 40 L 265 48" stroke="#FF7900" stroke-width="1.5" fill="none" opacity="0.5"/>
</svg>

