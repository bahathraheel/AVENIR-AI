<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your AVENIR AI password. Enter your registered email address to receive password recovery instructions.">
  <title>Reset Password - AVENIR AI</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-logo" aria-label="Return to AVENIR AI home">
          <span class="logo-text">AVENIR</span><span class="logo-ai">AI</span>
        </a>
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>
      </div>

      <!-- Error notification container -->
      <div class="auth-error hidden" id="forgotError" role="alert" aria-live="assertive">
        <i data-lucide="alert-circle" class="alert-icon"></i>
        <span class="error-text" id="forgotErrorText">We couldn't find an account with that email.</span>
      </div>

      <!-- Success notification container -->
      <div class="auth-success hidden" id="forgotSuccess" role="status" aria-live="polite">
        <i data-lucide="check-circle" class="alert-icon success-icon"></i>
        <span class="success-text" id="forgotSuccessText">Password reset link sent! Check your inbox.</span>
      </div>

      <!-- Forgot Password Form -->
      <form class="auth-form" id="forgotForm" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Registered Email</label>
          <div class="input-wrapper">
            <i data-lucide="mail" class="input-icon"></i>
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-input" 
              placeholder="Enter your registered email" 
              required 
              autocomplete="email"
            >
          </div>
          <p class="form-hint">A password recovery email will be dispatched to this address.</p>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-block btn-auth" id="forgotBtn">
          <span class="btn-text">Send Reset Link</span>
          <span class="btn-spinner hidden" id="forgotSpinner">
            <i data-lucide="loader" class="spinner-icon"></i>
          </span>
        </button>
      </form>

      <!-- Card Footer -->
      <footer class="auth-footer">
        <a href="login.html" class="back-link">
          <i data-lucide="arrow-left" class="icon-inline"></i>
          <span>Back to Sign In</span>
        </a>
      </footer>
    </div>
  </div>

  <!-- Firebase Compat SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- App Auth & Config -->
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) {
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
